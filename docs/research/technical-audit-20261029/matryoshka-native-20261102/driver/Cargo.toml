[package]
name = "warm-matryoshka-native-eval"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
warm = { package = "warm-rust", path = "../../../../..", features = ["local-models"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
libc = "0.2"
